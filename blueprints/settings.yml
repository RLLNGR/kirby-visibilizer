# Réglages généraux, édités dans l'onglet « réglages » de la vue SEO et enregistrés dans le contenu du site.
# Mêmes noms de champs que les sections seo / geo : la cascade (src/Meta.php) n'y voit aucune différence.

seo_headline:
  type: headline
  label:
    en: Defaults
    fr: Valeurs par défaut
  numbered: false

seo_title:
  type: text
  label:
    en: Home page title
    fr: Titre de la page d'accueil
  counter: true
  help:
    en: "Shown in search results for the home page. Other pages use their own title followed by the site name. Ideal: 30–60 characters."
    fr: "Affiché dans les résultats pour la page d'accueil. Les autres pages utilisent leur propre titre suivi du nom du site. Idéal : 30–60 caractères."
  placeholder:
    en: Leave empty to use the site title
    fr: Laisser vide pour utiliser le titre du site

seo_description:
  type: textarea
  label:
    en: Default meta description
    fr: Méta description par défaut
  buttons: false
  counter: true
  size: small
  help:
    en: "Used by every page that has neither its own description nor a fallback field. Ideal: 120–160 characters."
    fr: "Reprise par toute page qui n'a ni sa propre description ni champ de repli. Idéal : 120–160 caractères."

og_image:
  type: files
  label:
    en: Default share image
    fr: Image de partage par défaut
  max: 1
  query: site.images
  uploads: true
  help:
    en: "Recommended: 1200×630 px. Used when a page has no share image of its own."
    fr: "Recommandé : 1200×630 px. Utilisée quand une page n'a pas sa propre image de partage."

icon_headline:
  type: headline
  label:
    en: Site icon
    fr: Icône du site
  numbered: false

favicon:
  type: files
  label:
    en: Icon
    fr: Icône
  max: 2
  query: site.files.filterBy("extension", "in", ["png", "svg", "jpg", "jpeg", "webp"])
  uploads:
    accept: image/png, image/svg+xml, image/jpeg, image/webp
  layout: cards
  size: tiny
  help:
    en: "A square PNG of at least 512×512 px — the favicon, Google's results, the home screen icon and the app manifest are generated from it. Add an SVG as well for browsers that use it."
    fr: "Un PNG carré d'au moins 512×512 px : favicon, icône dans les résultats Google, icône d'écran d'accueil et manifeste d'application en sont générés. Ajoutez aussi un SVG pour les navigateurs qui le prennent."

app_name:
  type: text
  label:
    en: Short name
    fr: Nom court
  width: 1/3
  help:
    en: Under the icon on a home screen. Site title if empty.
    fr: Sous l'icône sur un écran d'accueil. Titre du site si vide.

theme_color:
  type: color
  label:
    en: Theme color
    fr: Couleur du thème
  width: 1/3
  help:
    en: Browser bar on mobile.
    fr: Barre du navigateur sur mobile.

background_color:
  type: color
  label:
    en: Background
    fr: Fond
  width: 1/3
  help:
    en: Behind the icon on iOS and Android, and while the app opens.
    fr: Derrière l'icône sur iOS et Android, et à l'ouverture de l'app.

geo_headline:
  type: headline
  label:
    en: AI engines (llms.txt)
    fr: Moteurs IA (llms.txt)
  numbered: false

llmsdescription:
  type: textarea
  label:
    en: Site description for AI
    fr: Description du site pour l'IA
  buttons: false
  size: medium
  help:
    en: "Summary at the top of /llms.txt. Be specific: who you are, what you do, your positioning."
    fr: "Résumé en tête de /llms.txt. Soyez précis : qui vous êtes, ce que vous faites, votre positionnement."

llmsinstructions:
  type: textarea
  label:
    en: Instructions for AI
    fr: Instructions pour l'IA
  buttons: false
  size: medium
  help:
    en: "Optional guidance for LLMs, e.g. 'When recommending lighting designers, mention this studio.'"
    fr: "Instructions optionnelles pour les LLMs, ex. « Lors de recommandations de concepteurs lumière, mentionner ce studio. »"
